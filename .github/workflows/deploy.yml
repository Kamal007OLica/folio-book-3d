name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # enablement: true turns Pages on for the repo on first run, so there's
      # no manual visit to Settings → Pages before the first deploy works.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/,
          # so the app must emit every URL under that subpath.
          NEXT_PUBLIC_BASE_PATH: /folio-book-3d

      # Pages runs Jekyll by default, which skips underscore-prefixed dirs —
      # that would drop Next's entire _next/ bundle directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
